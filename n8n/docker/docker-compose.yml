# n8n + Cloudflare WARP, ready for the YouTube Transcript MCP.
#
#   docker compose up -d        → n8n on http://localhost:5678
#
# Already running n8n? You only need the `warp` service: copy it into your
# existing compose file (same network as n8n), or run ./install-warp.sh.

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-UTC}
      # Set these when n8n runs behind a domain, e.g. https://n8n.example.com/
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PROTOCOL=${N8N_PROTOCOL:-http}
      - WEBHOOK_URL=${WEBHOOK_URL:-http://localhost:5678/}
    volumes:
      - n8n-data:/home/node/.n8n

  # Free Cloudflare WARP connection exposed as a SOCKS5/HTTP proxy on port 1080.
  # n8n reaches it as http://warp:1080. Do NOT publish port 1080 — it would
  # be an open proxy for anyone who can reach your server.
  warp:
    image: caomingjun/warp:latest
    restart: unless-stopped
    device_cgroup_rules:
      - "c 10:200 rwm"
    cap_add:
      - MKNOD
      - AUDIT_WRITE
      - NET_ADMIN
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=0
      - net.ipv4.conf.all.src_valid_mark=1
    environment:
      - WARP_SLEEP=2
    volumes:
      - warp-data:/var/lib/cloudflare-warp

volumes:
  n8n-data:
  warp-data:
